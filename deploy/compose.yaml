name: commitpool

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: commitpool
      POSTGRES_PASSWORD: commitpool
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U commitpool -d commitpool_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    profiles: [app]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: commitpool:dev
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://commitpool:commitpool@postgres:5432/commitpool?sslmode=disable
      PORT: "8080"
    ports:
      - "${COMMITPOOL_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
