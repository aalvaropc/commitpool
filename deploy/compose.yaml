name: commitpool

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: commitpool
      POSTGRES_PASSWORD: commitpool
      POSTGRES_DB: postgres
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U commitpool -d commitpool_test"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
